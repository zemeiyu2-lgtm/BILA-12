<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#234F42">
<title>MOS-DIS · 门徒训练平台 V1.5</title>
<style>
:root{--green:#234F42;--green2:#3E7463;--cream:#F7F3EB;--paper:#FFFDF9;--ink:#252525;--muted:#77746D;--line:#E6DFD3;--gold:#B7965B;--gold2:#E9DCC4;--soft:#F3EFE7;--good:#EAF4ED;--danger:#9B4D45;--shadow:0 8px 24px rgba(35,79,66,.06);--shadow2:0 2px 10px rgba(35,79,66,.04);--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:18px 14px 94px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:42px;height:42px;border-radius:13px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);font-size:24px}.brand strong{display:block;color:var(--green);font-size:20px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}.ghost{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;color:var(--muted)}.card{background:var(--paper);border:1px solid rgba(35,79,66,.055);box-shadow:var(--shadow);border-radius:var(--r);transition:box-shadow .22s ease,transform .22s ease}.hero{padding:20px;margin-bottom:12px;background:linear-gradient(180deg,#FFFDF9 0%,#FBF8F1 100%)}.eyebrow{font-size:11px;color:var(--muted)}.hero h1{font-size:27px;line-height:1.3;color:var(--green);margin:3px 0 8px}.hero p{margin:0;color:#56544e;font-size:14px}.hero-action{margin-top:15px;display:flex;gap:8px}.primary{background:var(--green);color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:700;transition:transform .15s ease,opacity .15s ease;box-shadow:0 3px 10px rgba(35,79,66,.12)}.secondary{background:var(--soft);color:var(--green);border:0;border-radius:12px;padding:11px 15px;font-weight:700;transition:background .15s ease,transform .15s ease}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{padding:14px;text-align:center}.stat b{display:block;font-size:24px;color:var(--green)}.stat span{font-size:10px;color:var(--muted)}.today{padding:16px;margin-bottom:12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section-head h2{margin:0;color:var(--green);font-size:17px}.link{border:0;background:none;color:var(--green);font-size:11px}.today-ref{font-size:11px;color:var(--muted);margin-bottom:3px}.today-title{font-size:22px;font-weight:800;color:var(--green);line-height:1.35}.today-focus{font-size:13px;margin:7px 0 14px}.today-meta{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--soft);color:#615C53;border-radius:999px;padding:5px 9px;font-size:10px}.week-card{padding:16px;margin-bottom:12px}.week-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.week-top .title{font-size:19px;font-weight:800;color:var(--green)}.week-top .theme{font-size:11px;color:var(--muted)}.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:13px}.day{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 3px;text-align:center;font-size:9px;color:var(--muted)}.day strong{display:block;color:var(--green);font-size:11px}.day.today{outline:2px solid var(--gold);outline-offset:1px}.day.done{background:var(--good);border-color:#D4E6D9;color:var(--green)}.day.sunday{border-top:3px solid var(--gold)}.mini{display:grid;gap:7px}.mini-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:13px;padding:11px 12px;border:1px solid var(--line)}.mini-main{min-width:0}.mini-kicker{font-size:10px;color:var(--muted)}.mini-title{font-size:13px;font-weight:700;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-ref{font-size:10px;color:var(--muted)}.pill-btn{border:0;background:var(--soft);color:var(--green);border-radius:10px;padding:8px 10px;font-weight:700}.map{padding:16px;margin-bottom:12px}.map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.map-item{padding:11px 8px;background:#fff;border:1px solid var(--line);border-radius:13px}.map-item b{display:block;color:var(--green);font-size:12px}.map-item span{font-size:9px;color:var(--muted)}.profile{padding:16px;margin-bottom:12px}.profile-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.profile-row:last-child{border-bottom:0}.profile-row span:first-child{color:var(--muted);font-size:11px}.profile-row span:last-child{text-align:right;font-size:12px}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,250,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:50}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;border:0;padding:10px 4px 11px;color:var(--muted);font-size:10px;transition:color .15s ease,transform .15s ease}.nav button.active{color:var(--green);font-weight:800}.nav button span{display:block;font-size:16px;margin-bottom:2px}.modal{position:fixed;inset:0;background:rgba(30,35,32,.42);display:none;align-items:flex-end;z-index:100;backdrop-filter:blur(2px)}.modal.open{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#FFFEFB;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:18px 17px 26px;box-shadow:0 -8px 28px rgba(0,0,0,.08)}.sheet-head{display:flex;justify-content:space-between;gap:10px}.sheet h2{margin:2px 0;color:var(--green);font-size:22px;line-height:1.35}.close{border:0;background:none;color:var(--muted);font-size:22px}.ref{font-size:11px;color:var(--muted)}.scripture{margin:13px 0;padding:15px 16px;background:var(--cream);border-left:5px solid var(--gold);border-radius:14px;font-family:Georgia,"Songti SC","SimSun",serif;font-size:15px;line-height:2;white-space:pre-wrap}.daily-block{margin:12px 0}.daily-label{font-size:11px;color:var(--muted);margin-bottom:4px}.daily-value{font-size:15px}.choice-grid{display:grid;gap:8px;margin-top:8px}.choice{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;text-align:left}.choice.selected{border-color:var(--gold);background:#F5EDDF;font-weight:700;box-shadow:inset 0 0 0 1px rgba(183,150,91,.16)}.choice-dot{display:inline-grid;place-items:center;width:20px;height:20px;border:1.5px solid currentColor;border-radius:50%;vertical-align:-4px;margin-right:8px;box-sizing:border-box;font-size:10px;transition:background .15s ease,color .15s ease}.action-box{background:var(--soft);border-radius:13px;padding:12px;margin:12px 0}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.footer-note{text-align:center;color:var(--muted);font-size:10px;margin-top:14px}
.phase-list{display:grid;gap:10px}.phase{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.phase summary{list-style:none;cursor:pointer;padding:15px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:background .16s ease}.phase summary::-webkit-details-marker{display:none}.phase-name{color:var(--green);font-weight:800;font-size:15px}.phase-meta{color:var(--muted);font-size:10px}.phase-desc{padding:0 15px 12px;color:var(--muted);font-size:11px}.phase-weeks{padding:0 10px 10px;display:grid;gap:6px}.week-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;transition:transform .16s ease,box-shadow .16s ease}.week-row-main{min-width:0}.week-row-kicker{font-size:10px;color:var(--muted)}.week-row-title{font-size:13px;font-weight:700;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day-step{display:none}.day-step.active{display:block}.stepbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:0 0 12px}.stepbar span{height:3px;background:var(--line);border-radius:99px;transition:background .2s ease}.stepbar span.active{background:var(--green)}.step-name{font-size:10px;color:var(--muted);margin:0 0 8px}.step-title{font-size:22px;font-weight:800;color:var(--green);line-height:1.3;margin:0 0 8px;letter-spacing:-.01em}.step-copy{font-size:16px;line-height:1.78;color:#3E3D38;max-width:46em}.step-nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.step-nav button{min-width:92px}.step-center{text-align:center;padding:26px 8px 18px}.step-center .done-mark{font-size:34px;color:var(--green);margin-bottom:8px}.step-center h3{font-size:22px;color:var(--green);margin:0 0 8px}.step-center p{color:var(--muted);font-size:12px;margin:0}.home-progress{font-size:11px;color:var(--muted)}.home-title{font-size:22px;font-weight:800;color:var(--green);line-height:1.35;margin-top:4px}.home-core{font-size:13px;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.home-ref{font-size:11px;color:var(--muted);margin-top:3px}.week-simple{padding:16px;margin-bottom:12px}.week-simple .section-head{margin-bottom:7px}
.hidden{display:none!important}.empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}.notice{padding:10px 12px;border-radius:12px;background:#F7F3EA;color:var(--muted);font-size:10px;margin-bottom:12px}.notice.error{background:#FFF2F0;color:var(--danger)}
button:active{transform:translateY(1px)}
.choice:focus-visible,.day:focus-visible,.week-row:focus-visible,.pill-btn:focus-visible,.primary:focus-visible,.secondary:focus-visible,.ghost:focus-visible,.link:focus-visible{outline:2px solid rgba(183,150,91,.75);outline-offset:2px}
.phase summary:hover{background:#FBF8F1}.week-row:hover{transform:translateY(-1px);box-shadow:var(--shadow2)}.choice:hover{border-color:#D8C8AB}.done-mark{animation:popIn .32s ease}.day-step.active{animation:stepIn .22s ease}
@keyframes popIn{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes stepIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:520px){.hero h1{font-size:24px}.map-grid{grid-template-columns:repeat(2,1fr)}.today-title{font-size:20px}.sheet-actions{grid-template-columns:1fr}.app{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="brandmark">🌿</div><div><strong>MOS</strong><small>门徒训练 · 经文、生活与实践</small></div></div>
  <button class="ghost" onclick="openSettings()">⚙</button>
</header>

<div id="notice"></div>

<section id="view-home">
  <div class="card hero">
    <div class="eyebrow" id="todayLabel">今日</div>
    <div class="home-ref" id="homeTodayRef">读取经文…</div>
    <div class="home-title" id="homeTodayTitle">今日内容</div>
    <div class="home-core" id="homeTodayCore">—</div>
    <div class="hero-action"><button class="primary" onclick="openToday()">开始</button></div>
  </div>
  <div class="stats" style="grid-template-columns:repeat(2,1fr)">
    <div class="card stat"><b id="statDone">0</b><span>已完成</span></div>
    <div class="card stat"><b id="statWeek">0/7</b><span>本周</span></div>
  </div>
  <section class="card week-simple">
    <div class="section-head"><h2>本周</h2><span class="home-progress" id="homeWeekProgress">0/7</span></div>
    <div class="week-top"><div><div class="title" id="homeWeekTitle">—</div><div class="theme" id="homeWeekTheme"></div></div></div>
    <div class="week-grid" id="homeWeekGrid"></div>
  </section>
</section>

<section id="view-week" class="hidden">
  <section class="card week-simple">
    <div class="section-head"><button class="link" onclick="switchView('home')">← 返回</button><span class="chip" id="weekCounter">第1周</span></div>
    <div class="week-top"><div><div class="title" id="weekTitle">—</div><div class="theme" id="weekTheme">—</div></div></div>
    <div class="week-grid" id="weekGrid"></div>
  </section>
  <div class="section-head"><h2 style="margin:0;color:var(--green);font-size:17px">7日</h2></div>
  <div class="mini" id="weekDays"></div>
</section>

<section id="view-map" class="hidden">
  <section class="card map">
    <div class="section-head"><h2>全年</h2><span class="home-progress">4阶段</span></div>
    <div class="phase-list" id="allStages"></div>
  </section>
</section>

<section id="view-me" class="hidden">
  <section class="card profile">
    <div class="section-head"><button class="link" onclick="switchView('home')">← 返回</button><h2 style="margin:0;color:var(--green);font-size:17px">我的</h2></div>
    <div class="profile-row"><span>姓名</span><span id="meUser">游客</span></div>
    <div class="profile-row"><span>已完成</span><span id="meDone">0 天</span></div>
    <div class="profile-row"><span>当前周</span><span id="meWeek">第1周</span></div>
    <div class="profile-row"><span>阶段</span><span id="meStage">—</span></div>
    <div class="profile-row"><span>连续完成</span><span id="meStreak">0 天</span></div>
    <div class="profile-row"><span>提醒</span><span id="meReminder">关闭</span></div>
  </section>
  <section class="card profile">
    <div class="section-head"><h2 style="margin:0;color:var(--green);font-size:17px">原则</h2></div>
    <div class="notice">记录的是完成与回应，不是属灵分数。</div>
    <button class="secondary" style="width:100%" onclick="openSettings()">设置</button>
  </section>
</section>
</div>

<nav class="bottom"><div class="nav"><button class="active" id="nav-home" onclick="switchView('home')"><span>⌂</span>今天</button><button id="nav-week" onclick="switchView('week')"><span>◫</span>本周</button><button id="nav-map" onclick="switchView('map')"><span>⌘</span>全年</button><button id="nav-me" onclick="switchView('me')"><span>○</span>我的</button></div></nav>

<div class="modal" id="dayModal"><div class="sheet">
  <div class="sheet-head"><div><div class="ref" id="dayKicker">第1周 · 主日</div><h2 id="dayTitle">—</h2></div><button class="close" onclick="closeDay()">×</button></div>
  <div class="stepbar" id="dayStepbar"><span class="active"></span><span></span><span></span><span></span><span></span></div>

  <section class="day-step active" data-step="1">
    <div class="step-name">1 / 5 · 经文</div>
    <div class="ref" id="dayRef">—</div>
    <div class="scripture" id="dayScripture">正在读取经文…</div>
    <div class="daily-block"><div class="daily-label">核心</div><div class="daily-value" id="dayCore">—</div></div>
    <div class="step-nav"><span></span><button class="primary" onclick="nextDayStep()">下一步</button></div>
  </section>

  <section class="day-step" data-step="2">
    <div class="step-name">2 / 5 · 反思</div>
    <h3 class="step-title">想一想</h3>
    <div class="step-copy" id="dayQuestion">—</div>
    <div class="step-nav"><button class="secondary" onclick="prevDayStep()">上一步</button><button class="primary" onclick="nextDayStep()">下一步</button></div>
  </section>

  <section class="day-step" data-step="3">
    <div class="step-name">3 / 5 · 选择</div>
    <h3 class="step-title">你的回应</h3>
    <div class="choice-grid" id="dayChoices"></div>
    <div class="step-nav"><button class="secondary" onclick="prevDayStep()">上一步</button><button class="primary" onclick="nextDayStep()">下一步</button></div>
  </section>

  <section class="day-step" data-step="4">
    <div class="step-name">4 / 5 · 实践</div>
    <h3 class="step-title">做一件事</h3>
    <div class="action-box"><div id="dayAction">—</div></div>
    <div id="dayRelationWrap" class="daily-block hidden"><div class="daily-label">关系</div><div class="daily-value" id="dayShare">—</div></div>
    <div id="dayMissionWrap" class="daily-block hidden"><div class="daily-label">使命</div><div class="daily-value" id="dayMission">—</div></div>
    <div class="step-nav"><button class="secondary" onclick="prevDayStep()">上一步</button><button class="primary" onclick="nextDayStep()">完成</button></div>
  </section>

  <section class="day-step" data-step="5">
    <div class="step-center"><div class="done-mark">✓</div><h3>已完成</h3><p>今天的回应已保存。</p></div>
    <div class="step-nav"><button class="secondary" onclick="closeDay()">关闭</button><button class="primary" id="nextDayBtn" onclick="openNextDay()">下一天</button></div>
  </section>
</div></div>

<div class="modal" id="settingsModal"><div class="sheet"><div class="sheet-head"><div><div class="ref">MOS设置</div><h2>设置</h2></div><button class="close" onclick="closeSettings()">×</button></div><div class="daily-block"><div class="daily-label">我的名字</div><input id="nameInput" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:12px" placeholder="姓名"></div><div class="daily-block"><div class="daily-label">每日提醒</div><button class="secondary" style="width:100%" onclick="toggleReminder()" id="reminderBtn">开启提醒</button><div id="reminderStatus" style="font-size:10px;color:var(--muted);margin-top:5px"></div></div><div class="sheet-actions"><button class="primary" onclick="saveSettings()">保存</button><button class="secondary" onclick="closeSettings()">关闭</button></div></div></div>

<script src="bible-engine.js"></script>
<script>
const CONFIG={curriculumUrl:'mos-52w.csv',dailyUrl:'mos-364d.csv',startDate:'2026-08-30T00:00:00'};
// 内容层可独立替换：平台只读取 CSV，不在 index.html 内维护全年内容。
const STAGES=[
 {name:'看见自己',weeks:[1,13],icon:'◉',desc:'身份、价值、控制、比较与自我认识'},
 {name:'重新连接',weeks:[14,26],icon:'◎',desc:'归属、关系、饶恕、家庭与群体'},
 {name:'进入生活',weeks:[27,39],icon:'◌',desc:'工作、家庭、责任、恩赐与见证'},
 {name:'结出果子',weeks:[40,52],icon:'✦',desc:'成长、祝福、传递、委身与使命'}
];
const DOW=['主日','周一','周二','周三','周四','周五','周六'];
let curriculum=[];let daily=[];let currentWeek=1;let selectedDay=null;let selectedChoice='';
let user=localStorage.getItem('mos_user')||'游客';
let state=JSON.parse(localStorage.getItem('mos_state_v14')||localStorage.getItem('mos_state_v11')||localStorage.getItem('mos_state_v1')||'{}');
state.completed=state.completed||{};state.choices=state.choices||{};state.reminder=!!state.reminder;
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function csv(text){
  const out=[]; let row=[], cell='', q=false;
  text=String(text||'').replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c==='"'){ if(q&&n==='"'){cell+='"';i++;} else q=!q; continue; }
    if(c===','&&!q){row.push(cell.trim());cell='';continue;}
    if((c==='\n'||c==='\r')&&!q){
      if(c==='\r'&&n==='\n')i++;
      row.push(cell.trim());
      if(row.some(x=>x!==''))out.push(row);
      row=[];cell='';continue;
    }
    cell+=c;
  }
  if(cell!==''||row.length){row.push(cell.trim());if(row.some(x=>x!==''))out.push(row);}
  if(out.length<2)return[];
  const h=out[0].map(x=>String(x).replace(/^\uFEFF/,'').trim());
  return out.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,String(r[i]??'').trim()])));
}
function pick(r,...keys){for(const k of keys){if(r[k]!==undefined&&String(r[k]).trim()!=='')return String(r[k]).trim();}return '';}
function normalizeWeekRows(rows){
  return rows.map((r,i)=>({
    week:Number(pick(r,'week','周次')||i+1),
    stage:pick(r,'stage','阶段'),
    functionName:pick(r,'week_function','周次功能'),
    sunday_theme:pick(r,'sunday_theme','主日主题','一句话主题','核心生命问题','title','标题'),
    bila_theme:pick(r,'bila_theme','BILA主题','主日方向','周次功能','focus','焦点'),
    reference:pick(r,'reference','核心经文','经文','经文引用'),
    practice:pick(r,'practice','本周实践','实践'),
    group_feedback:pick(r,'group_feedback','小组入口','伙伴反馈','群体反馈','feedback'),
    mission:pick(r,'mission','使命/传递','使命')
  })).filter(x=>Number.isFinite(x.week)&&x.week>=1&&x.week<=52);
}
function normalizeDailyRows(rows){
  return rows.map(r=>{
    const n=Number(pick(r,'dow','星期序','日序'));
    return {
      ...r,
      day_id:pick(r,'day_id','日ID'),
      week:Number(pick(r,'week','周次')||0),
      dow:(pick(r,'dow')!==''?n:((n-1)%7)),
      reference:pick(r,'reference','今日核心经文','核心经文','经文'),
      day_title:pick(r,'day_title','今日标题','日主题','日类型','title','标题'),
      core:pick(r,'core','每日核心信息','今日核心信息','核心信息'),
      question:pick(r,'question','今日反思入口','反思入口','问题'),
      life_action:pick(r,'life_action','实践','生命形成动作','实践'),
      share:pick(r,'share','关系/伙伴反馈','伙伴反馈','小组入口'),
      mission:pick(r,'mission','使命','使命/传递','使命'),
      optionA:pick(r,'option_a','选项A','A','choice_a'),
      optionB:pick(r,'option_b','选项B','B','choice_b'),
      optionC:pick(r,'option_c','选项C','C','choice_c'),
      fruit:pick(r,'fruit','生命果子'),
      choices:pick(r,'choices','今日自我选择','选择','选择回应','response_options')
    };
  }).filter(x=>x.week>=1&&x.week<=52&&x.dow>=0&&x.dow<=6);
}

function save(){localStorage.setItem('mos_state_v14',JSON.stringify(state))}
function done(id){return !!state.completed[id]}
function dayId(w,d){return (w-1)*7+d}
function todayDay(){const s=new Date(CONFIG.startDate),n=new Date();const a=new Date(s.getFullYear(),s.getMonth(),s.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());const diff=Math.floor((b-a)/86400000);return Math.max(0,Math.min(363,diff))}
function current(){const id=todayDay();return {week:Math.floor(id/7)+1,dow:id%7}}
function stageFor(w){const s=STAGES.find(x=>w>=x.weeks[0]&&w<=x.weeks[1]);return s?s.name:'—'}
function getWeek(w){return curriculum.find(x=>Number(x.week)===Number(w))||{week:w,sunday_theme:'本周',bila_theme:'',reference:'',practice:'',group_feedback:'',mission:''}}
function getDay(w,d){return daily.find(x=>Number(x.week)===w&&Number(x.dow)===d)||null}
function weekDone(w){let n=0;for(let d=0;d<7;d++)if(done(dayId(w,d)))n++;return n}
function allDone(){return Object.values(state.completed).filter(Boolean).length}
function streak(){let n=0,id=todayDay();while(id>=0&&done(id)){n++;id--}return n}
async function load(){
  let weekOK=false, dayOK=false;
  try{
    const r=await fetch(CONFIG.curriculumUrl+'?v=1.0.4',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rows=csv(await r.text());
    curriculum=normalizeWeekRows(rows);
    weekOK=curriculum.length===52;
    if(!weekOK)throw new Error('读取到 '+curriculum.length+' 周');
  }catch(e){
    curriculum=Array.from({length:52},(_,i)=>({week:i+1,sunday_theme:'第'+(i+1)+'周',bila_theme:'',reference:'',practice:'',group_feedback:'',mission:''}));
    notice('52周数据读取异常：'+e.message,true);
  }
  try{
    const r=await fetch(CONFIG.dailyUrl+'?v=1.0.4',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    daily=normalizeDailyRows(csv(await r.text()));
    dayOK=daily.length===364;
  }catch(e){ daily=[]; notice('每日数据读取异常：'+e.message,true); }
  const t=current(); currentWeek=t.week; render();
  if(weekOK&&dayOK) notice('MOS-DIS V1.5 · 内容已连接',false);
}
function notice(t,error=false){document.getElementById('notice').innerHTML=`<div class="notice ${error?'error':''}">${esc(t)}</div>`}
function switchView(v){['home','week','map','me'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==v));['home','week','map','me'].forEach(x=>document.getElementById('nav-'+x).classList.toggle('active',x===v));if(v==='week')renderWeek();if(v==='map')renderMap();if(v==='me')renderMe();window.scrollTo({top:0,behavior:'smooth'})}
function render(){renderHome();renderWeek();renderMap();renderMe()}
function renderHome(){
  const t=current(), w=getWeek(currentWeek), d=getDay(currentWeek,t.dow)||{};
  document.getElementById('todayLabel').textContent=`${DOW[t.dow]} · 第${t.week}周`;
  document.getElementById('statDone').textContent=allDone();
  document.getElementById('statWeek').textContent=weekDone(t.week)+'/7';
  document.getElementById('homeTodayRef').textContent=d.reference||w.reference||'经文';
  document.getElementById('homeTodayTitle').textContent=d.day_title||d.title||w.sunday_theme||'今日内容';
  document.getElementById('homeTodayCore').textContent=d.core||d.daily_core||w.bila_theme||'';
  document.getElementById('homeWeekTitle').textContent=w.sunday_theme||'本周';
  document.getElementById('homeWeekTheme').textContent=w.bila_theme||'';
  document.getElementById('homeWeekProgress').textContent=weekDone(t.week)+'/7';
  document.getElementById('homeWeekGrid').innerHTML=weekGrid(t.week);
}
function weekGrid(w){return DOW.map((n,d)=>{const id=dayId(w,d),now=current();const isT=now.week===w&&now.dow===d;return `<button class="day ${d===0?'sunday':''} ${done(id)?'done':''} ${isT?'today':''}" onclick="openDayBy(${w},${d})"><strong>${n}</strong>${done(id)?'✓':'○'}</button>`}).join('')}
function renderWeek(){
  const w=getWeek(currentWeek);
  document.getElementById('weekCounter').textContent=`第${currentWeek}周 · ${stageFor(currentWeek)}`;
  document.getElementById('weekTitle').textContent=w.sunday_theme||'本周';
  document.getElementById('weekTheme').textContent=w.bila_theme||'';
  document.getElementById('weekGrid').innerHTML=weekGrid(currentWeek);
  document.getElementById('weekDays').innerHTML=DOW.map((n,d)=>{const x=getDay(currentWeek,d)||{};return `<div class="mini-row"><div class="mini-main"><div class="mini-kicker">${n} · ${x.role||['主日','经文','观察','反思','关系','使命','回顾'][d]}</div><div class="mini-title">${esc(x.day_title||x.title||w.sunday_theme||'今日内容')}</div><div class="mini-ref">${esc(x.reference||w.reference||'')}</div></div><button class="pill-btn" onclick="openDayBy(${currentWeek},${d})">${done(dayId(currentWeek,d))?'已完成':'查看'}</button></div>`}).join('')}
function renderMap(){
  const host=document.getElementById('allStages');
  const currentStage=stageFor(currentWeek);
  host.innerHTML=STAGES.map(s=>{
    const open=s.name===currentStage;
    let weeks='';
    for(let w=s.weeks[0];w<=s.weeks[1];w++){
      const x=getWeek(w);
      weeks+=`<button class="week-row" onclick="goWeek(${w})"><div class="week-row-main"><div class="week-row-kicker">第${w}周 · ${weekDone(w)}/7</div><div class="week-row-title">${esc(x.sunday_theme||'本周')}</div></div><span class="pill-btn">查看</span></button>`;
    }
    return `<details class="phase" ${open?'open':''}><summary><span><span class="phase-name">${s.icon} ${s.name}</span><span class="phase-meta"> · 第${s.weeks[0]}–${s.weeks[1]}周</span></span><span class="phase-meta">${open?'收起':'展开'}</span></summary><div class="phase-desc">${esc(s.desc)}</div><div class="phase-weeks">${weeks}</div></details>`;
  }).join('');
}
function renderMe(){document.getElementById('meUser').textContent=user;document.getElementById('meDone').textContent=allDone()+' 天';document.getElementById('meWeek').textContent='第'+currentWeek+'周';document.getElementById('meStage').textContent=stageFor(currentWeek);document.getElementById('meStreak').textContent=streak()+' 天';document.getElementById('meReminder').textContent=state.reminder?'已开启':'关闭'}
function goWeek(w){currentWeek=Math.max(1,Math.min(52,Number(w)));switchView('week');renderWeek()}
async function openDay(){const t=current();openDayBy(t.week,t.dow)}
function isBibleRef(v){return /^.+?\d+(?::\d+(?:-\d+)?)?$/.test(String(v||'').trim().replace(/：/g,':'));}
let dayStep=1;
function updateDayStep(){
  document.querySelectorAll('#dayModal .day-step').forEach(el=>el.classList.toggle('active',Number(el.dataset.step)===dayStep));
  document.querySelectorAll('#dayStepbar span').forEach((el,i)=>el.classList.toggle('active',i<dayStep));
}
let soundOn=true;
function uiBeep(kind='click'){
  if(!soundOn) return;
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=window.__mosAudio||(window.__mosAudio=new C());
    if(ctx.state==='suspended') ctx.resume();
    const o=ctx.createOscillator(), g=ctx.createGain();
    const now=ctx.currentTime;
    const map={click:[520,.045,.05],select:[680,.07,.045],next:[590,.055,.055],done:[760,.12,.06],error:[250,.1,.05]};
    const v=map[kind]||map.click;
    o.type='sine'; o.frequency.setValueAtTime(v[0],now);
    if(kind==='done') o.frequency.exponentialRampToValueAtTime(980,now+v[1]);
    g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(v[2],now+0.01); g.gain.exponentialRampToValueAtTime(0.0001,now+v[1]);
    o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+v[1]+0.02);
  }catch(e){}
}
function nextDayStep(){
  if(dayStep===3 && !selectedChoice){uiBeep('error');showToast('请选择一项');return}
  uiBeep(dayStep===4?'done':'next');
  if(dayStep===4){completeDay(); return;}
  dayStep=Math.min(5,dayStep+1);updateDayStep();
}
function prevDayStep(){uiBeep('click');dayStep=Math.max(1,dayStep-1);updateDayStep();}
function openNextDay(){
  if(!selectedDay){closeDay();return}
  let d=selectedDay.dow+1,w=selectedDay.week;
  if(d>6){d=0;w=Math.min(52,w+1)}
  if(w===selectedDay.week && d===selectedDay.dow){closeDay();return}
  openDayBy(w,d);
}
async function openDayBy(w,d){
  selectedDay={week:Number(w),dow:Number(d),id:dayId(Number(w),Number(d))};
  selectedChoice=state.choices[selectedDay.id]||''; dayStep=1; updateDayStep();
  const wk=getWeek(w),data=getDay(w,d)||{};
  const bibleRef=isBibleRef(data.reference)?data.reference:wk.reference;
  document.getElementById('dayKicker').textContent=`第${w}周 · ${DOW[d]}`;
  document.getElementById('dayTitle').textContent=data.day_title||data.title||(d===0?wk.sunday_theme:`${wk.sunday_theme||'本周主题'} · ${DOW[d]}`);
  document.getElementById('dayRef').textContent=bibleRef||'—';
  document.getElementById('dayCore').textContent=data.core||data.daily_core||wk.bila_theme||'—';
  document.getElementById('dayQuestion').textContent=data.question||data.reflection||'今天，这段经文最接近我生活中的什么？';
  document.getElementById('dayAction').textContent=data.life_action||data.action||wk.practice||'选择一件今天可以忠心做的小事。';
  const rel=data.share||data.group_prompt||'';
  const mis=data.mission||'';
  document.getElementById('dayShare').textContent=rel;
  document.getElementById('dayMission').textContent=mis;
  document.getElementById('dayRelationWrap').classList.toggle('hidden',!rel);
  document.getElementById('dayMissionWrap').classList.toggle('hidden',!mis);
  document.getElementById('dayChoices').innerHTML=choicesFor(data); bindChoices();
  document.getElementById('dayScripture').textContent='正在读取经文…';
  document.getElementById('dayModal').classList.add('open');
  await loadBible(bibleRef);
}
function choicesFor(d){
  let arr=[];
  if(d.optionA||d.optionB||d.optionC){
    arr=[d.optionA,d.optionB,d.optionC].filter(Boolean);
  }
  if(!arr.length){
    const raw=(d.choices||d.options||'').trim();
    if(raw){
      // 支持CSV中的“①…②…③…”单字段格式，也支持换行/竖线/分号。
      const marked=[...raw.matchAll(/[①②③]\s*([^①②③]+)/g)].map(m=>m[1].trim()).filter(Boolean);
      arr=marked.length>=2 ? marked : raw.split(/\r?\n|[|｜;]/).map(x=>x.trim()).filter(Boolean);
    }else{
      arr=[];
    }
  }
  if(arr.length<3){
    const defaults=['我还没有留意','我开始看见','我愿意作出一个具体回应'];
    for(let i=arr.length;i<3;i++) arr.push(defaults[i]);
  }
  arr=arr.slice(0,3);
  return arr.map(x=>`
    <button type="button" class="choice ${x===selectedChoice?'selected':''}" role="radio" aria-checked="${x===selectedChoice?'true':'false'}" tabindex="${x===selectedChoice?'0':'-1'}" data-choice="${esc(x)}">
      <span class="choice-dot">${x===selectedChoice?'●':''}</span>${esc(x)}
    </button>
  `).join('');
}

function bindChoices(){
  const items=[...document.querySelectorAll('#dayChoices .choice')];
  items.forEach((btn,i)=>{
    btn.addEventListener('click',()=>pickChoice(btn,btn.dataset.choice||''));
    btn.addEventListener('keydown',(e)=>{
      if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();items[(i+1)%items.length].focus();}
      if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();items[(i-1+items.length)%items.length].focus();}
      if(e.key===' '||e.key==='Enter'){e.preventDefault();pickChoice(btn,btn.dataset.choice||'');}
    });
  });
}

function pickChoice(el,x){
  if(!selectedDay||!x)return;
  selectedChoice=String(x); uiBeep('select');
  document.querySelectorAll('#dayChoices .choice').forEach(b=>{
    const on=b===el;
    b.classList.toggle('selected',on);
    b.setAttribute('aria-checked',on?'true':'false');
    b.setAttribute('tabindex',on?'0':'-1');
    const dot=b.querySelector('.choice-dot'); if(dot) dot.textContent=on?'●':'';
  });
  state.choices[selectedDay.id]=selectedChoice;
  save();
}
async function loadBible(ref){if(!ref){document.getElementById('dayScripture').textContent='本日尚未配置经文。';return}try{if(window.BilaBible?.data){const b=await BilaBible.data(ref);let txt='';if(b?.text)txt=b.text;else if(Array.isArray(b?.verses))txt=b.verses.map(v=>`${v.verse} ${v.text}`).join('\n');else if(Array.isArray(b?.sections))txt=b.sections.flatMap(s=>s.verses||[]).map(v=>`${v.verse} ${v.text}`).join('\n');document.getElementById('dayScripture').textContent=txt||'未读取到经文。'}else document.getElementById('dayScripture').textContent='Bible Engine 未连接。';}catch(e){document.getElementById('dayScripture').textContent='经文读取失败：'+e.message}}
function saveChoice(){if(!selectedDay)return;state.choices[selectedDay.id]=selectedChoice||'未填写';save();showToast('已记录回应')}
function completeDay(){if(!selectedDay)return;if(!selectedChoice){uiBeep('error');showToast('请选择一项');dayStep=3;updateDayStep();return}state.completed[selectedDay.id]=true;state.choices[selectedDay.id]=selectedChoice;save();render();dayStep=5;updateDayStep();uiBeep('done');showToast('已完成')}
function closeDay(){document.getElementById('dayModal').classList.remove('open');selectedDay=null}
function openToday(){const t=current();openDayBy(t.week,t.dow)}
function showToast(t){let x=document.getElementById('toast-x');if(!x){x=document.createElement('div');x.id='toast-x';x.style='position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:rgba(35,39,36,.94);color:#fff;padding:9px 15px;border-radius:99px;font-size:11px;z-index:300';document.body.appendChild(x)}x.textContent=t;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',1800)}
function openSettings(){document.getElementById('nameInput').value=user==='游客'?'':user;document.getElementById('reminderBtn').textContent=state.reminder?'关闭提醒':'开启提醒';document.getElementById('reminderStatus').textContent=state.reminder?'已开启':'未开启。';document.getElementById('settingsModal').classList.add('open')}
function closeSettings(){document.getElementById('settingsModal').classList.remove('open')}
function toggleReminder(){state.reminder=!state.reminder;save();openSettings()}
function saveSettings(){const v=document.getElementById('nameInput').value.trim();if(v){user=v;localStorage.setItem('mos_user',user)}save();closeSettings();render();showToast('已保存')}
load();
</script>
