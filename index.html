<main class="app">

<section id="home" class="screen">

<div class="section-title">21天进度</div>

<div class="card"><div class="guide" id="todayGuide"></div><p class="tiny" style="margin-bottom:0">不评分，不比较。每天只花几分钟，真实地想一想。</p></div>
</section>

<section id="day" class="screen hidden">
<button class="back" onclick="show('home')">← 返回</button>
<div class="section-title"><span id="dayType"></span> · <span id="dayDate"></span></div>
<div class="card"><span class="tag" id="dayMode"></span><h2 id="dayTitle"></h2><p class="guide" id="dayGuide"></p></div>

<div class="card"><div class="section-title" style="margin-top:0">思考入口</div><p class="note">从下面选一个最接近你现在注意到的内容。</p><div id="choices"></div><p class="tiny">没有标准答案。选择只是帮助你开始思考。</p></div>
<div class="card"><div class="section-title" style="margin-top:0">今日思考引导</div><p id="dayPrompt"></p><div class="hint" id="dayEntry"></div></div>
<div class="card"><div class="section-title" style="margin-top:0">生活导向</div><p class="guide" id="dayLife"></p><div class="section-title">今日操练</div><p id="dayPractice"></p><button class="btn primary" onclick="completeDay()">完成今天</button></div>
</section>

<section id="track" class="screen hidden">
<div class="section-title">我的21天轨迹</div>
<div class="card"><h2>先看变化，不看分数</h2><p class="note">这里记录你实际完成过的天数和每天留下的思考入口。它不是属灵等级。</p><div id="trackList"></div></div>
<div class="card"><strong>三周结束后</strong><p class="note">系统只帮助你看见重复出现的生命线索，不自动给你下结论。</p></div>
</section>
</main>

const START = new Date('2026-08-30T00:00:00');
let currentIndex=0, selectedChoice='';

function key(i){return 'bila21_'+i}
function localDate(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function activeIndex(){
  const d=localDate(); const diff=Math.floor((d-START)/86400000);
  return Math.max(0,Math.min(DAYS.length-1,diff));
}
function completed(i){return localStorage.getItem(key(i))==='done'}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo(0,0)}
function nav(id,el){show(id);document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');if(id==='track')renderTrack()}
function renderHome(){
 currentIndex=activeIndex(); const d=DAYS[currentIndex];
 document.getElementById('weekLabel').textContent=currentIndex<7?'第1周 · 恩典':currentIndex<14?'第2周 · 跟随':'第3周 · 走近人';
 document.getElementById('homeTitle').textContent=d.title;
 document.getElementById('homeGuide').textContent=d.guide;
 document.getElementById('mode').textContent=d.mode;
 document.getElementById('todayTitle').textContent=d.title;
 document.getElementById('todayPrompt').textContent=d.prompt;
 document.getElementById('todayGuide').textContent=d.guide;
 const done=DAYS.filter((_,i)=>completed(i)).length;
 document.getElementById('doneCount').textContent=done;
 document.getElementById('progress').style.width=(done/DAYS.length*100)+'%';
 document.getElementById('daygrid').innerHTML=DAYS.map((x,i)=>'<div class="day '+(completed(i)?'done ':'')+(i===currentIndex?'today':'')+'">'+(i+1)+(completed(i)?' ✓':'')+'</div>').join('');
}
function openDay(){renderDay(currentIndex);show('day')}
function renderDay(i){
 currentIndex=i; selectedChoice=localStorage.getItem('bila_choice_'+i)||'';
 const d=DAYS[i];
 document.getElementById('dayType').textContent=d.type;

 document.getElementById('dayMode').textContent=d.mode;
 document.getElementById('dayTitle').textContent=d.title;
 document.getElementById('dayGuide').textContent=d.guide;

 document.getElementById('dayVerse').textContent=d.verse;
 document.getElementById('dayPrompt').textContent=d.prompt;

 document.getElementById('dayLife').textContent=d.guide;
 document.getElementById('dayPractice').textContent=d.practice;
 const arr=d.entry.split(/[／/]/).map(x=>x.trim()).filter(Boolean);
 document.getElementById('choices').innerHTML=arr.map(x=>'<button class="choice '+(selectedChoice===x?'selected':'')+'" onclick="choose(this,\''+escapeAttr(x)+'\')">'+x+'</button>').join('');
}
function escapeAttr(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function choose(el,v){selectedChoice=v;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');localStorage.setItem('bila_choice_'+currentIndex,v)}
function completeDay(){
 if(!selectedChoice){toast('先选一个思考入口，再完成今天。');return}
 localStorage.setItem(key(currentIndex),'done');
 localStorage.setItem('bila_done_at_'+currentIndex,new Date().toISOString());
 toast('今天已记录。不是考试，只记录真实参与。');
 setTimeout(()=>{renderHome();show('home')},650);
}
function renderTrack(){
 const html=DAYS.map((d,i)=>completed(i)?'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><strong>Day '+(i+1)+' · '+d.title+'</strong><div class="tiny">'+(localStorage.getItem('bila_choice_'+i)||'已完成')+'</div></div>':'').join('');
 document.getElementById('trackList').innerHTML=html||'<p class="note">还没有完成记录。今天开始即可。</p>';
}
function reminder(){
 const msg='BILA 20:00 提醒：今天花几分钟，进入经文，想一想，再走一步。';
 if('Notification' in window){
   Notification.requestPermission().then(p=>{if(p==='granted')toast('浏览器提醒权限已开启；网页保持打开时可提醒。');else toast(msg)})
 }else toast(msg);
}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
renderHome();
</script>
</body></html>
