<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOS 1.2｜管理后台 V1.0</title>
<style>
:root{--bg:#f6f2ec;--card:#fff;--ink:#302a26;--muted:#7c7168;--line:#e5ddd5;--accent:#4a3e35;--ok:#357a57;--warn:#a86a22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei","Noto Sans SC",sans-serif}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eee8e1;color:var(--ink)}
.danger{background:#f4dfdf;color:#8a3030}
.hidden{display:none!important}
.app{min-height:100vh}
.top{height:64px;background:#3f352e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.top strong{font-size:18px}
.top span{font-size:12px;color:#d9d1ca}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px}
.nav{width:100%;text-align:left;background:transparent;margin:3px 0;color:#5f554e}
.nav.active{background:#eee8e1;font-weight:bold}
.main{padding:22px;max-width:1450px;width:100%;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 12px #0000000a}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat b{display:block;font-size:27px;margin-top:7px}
.stat small,.muted{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select,.toolbar input{width:auto;min-width:150px}
input,textarea,select{width:100%;border:1px solid #dcd2c9;border-radius:9px;padding:10px;background:#fff;color:var(--ink)}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.row7{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.daybtn{padding:9px 5px;background:#f4efe9;border:1px solid var(--line)}
.daybtn.active{background:#3f352e;color:#fff}
.daybtn.published{border-bottom:3px solid var(--ok)}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee8e1;font-size:11px}
.badge.ok{background:#dceee3;color:#276a49}
.badge.warn{background:#f8ead6;color:#8a5b1f}
.editorHead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.notice{padding:10px 12px;border-radius:10px;background:#f4efe9;color:#665b53;margin-bottom:12px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{width:min(420px,100%);background:#fff;border-radius:18px;padding:28px;border:1px solid var(--line)}
.login h1{margin-top:0}
.statusbar{padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;font-size:13px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.grid4{grid-template-columns:1fr 1fr}.fieldgrid,.grid2{grid-template-columns:1fr}.row7{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="box">
    <h1>MOS 1.2</h1>
    <p class="muted">内容管理后台 V1.0</p>
    <div id="setupHint" class="notice hidden">尚未设置管理员密码。请先在 Apps Script 中运行 <b>setAdminPassword()</b>。</div>
    <label>管理员密码</label>
    <input id="password" type="password" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')login()">
    <div class="actions">
      <button class="primary" onclick="login()">登录</button>
    </div>
    <p id="loginMsg" class="muted"></p>
  </div>
</div>

<div id="app" class="app hidden">
<header class="top">
  <div><strong>MOS 1.2｜内容管理后台</strong><div><span>研究 → 校准 → 内容 → 发布</span></div></div>
  <button class="secondary" onclick="logout()">退出</button>
</header>
<div class="layout">
  <aside class="side">
    <button id="navOverview" class="nav active" onclick="showPage('overview')">📊 总览</button>
    <button id="navWeeks" class="nav" onclick="showPage('weeks')">📖 52周内容</button>
    <button id="navDays" class="nav" onclick="showPage('days')">📅 每日内容</button>
    <button id="navEvents" class="nav" onclick="showPage('events')">🎄 节期</button>
    <button id="navPublish" class="nav" onclick="showPage('publish')">🚀 发布管理</button>
  </aside>
  <main class="main">
    <div id="statusbar" class="statusbar">正在连接云端内容库……</div>
    <section id="page-overview"></section>
    <section id="page-weeks" class="hidden"></section>
    <section id="page-days" class="hidden"></section>
    <section id="page-events" class="hidden"></section>
    <section id="page-publish" class="hidden"></section>
  </main>
</div>
</div>

<script>
let TOKEN='';
let DATA={days:[],weeks:[],events:[],research:[],status:{}};
let currentWeek=1,currentDow=0,currentDay=null;

const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;")}
function msg(s){$('statusbar').textContent=s}

function login(){
  const p=$('password').value;
  if(!p){$('loginMsg').textContent='请输入密码';return}
  google.script.run.withSuccessHandler(r=>{
    if(r.needSetup){$('setupHint').classList.remove('hidden');$('loginMsg').textContent=r.message;return}
    if(!r.ok){$('loginMsg').textContent=r.message||'登录失败';return}
    TOKEN=r.token;
    $('login').classList.add('hidden');$('app').classList.remove('hidden');
    boot();
  }).withFailureHandler(e=>$('loginMsg').textContent='登录失败：'+e.message).loginAdmin(p);
}
function logout(){
  google.script.run.withSuccessHandler(()=>location.reload()).logoutAdmin(TOKEN);
}
function boot(){
  msg('正在读取 MOS 云端内容库……');
  google.script.run.withSuccessHandler(r=>{
    DATA=r;
    msg('● 云端内容库正常｜API '+r.api);
    renderAll();
  }).withFailureHandler(e=>msg('读取失败：'+e.message)).getAdminBootstrap(TOKEN);
}
function showPage(page){
  ['overview','weeks','days','events','publish'].forEach(x=>$('page-'+x).classList.toggle('hidden',x!==page));
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  $('nav'+page.charAt(0).toUpperCase()+page.slice(1)).classList.add('active');
  if(page==='overview')renderOverview();
  if(page==='weeks')renderWeeks();
  if(page==='days')renderDays();
  if(page==='events')renderEvents();
  if(page==='publish')renderPublish();
}
function renderAll(){renderOverview();renderWeeks();renderDays();renderEvents();renderPublish();}
function renderOverview(){
  const s=DATA.status||{},c=s.counts||{};
  $('page-overview').innerHTML=`
  <div class="grid4">
    <div class="card stat"><small>年度周数</small><b>${c.weeks||52}</b><span class="muted">52周</span></div>
    <div class="card stat"><small>日单元</small><b>${c.days||364}</b><span class="muted">52周 × 7日</span></div>
    <div class="card stat"><small>已发布日</small><b>${c.publishedDays||0}</b><span class="muted">用户端可见</span></div>
    <div class="card stat"><small>已发布周</small><b>${c.publishedWeeks||0}</b><span class="muted">管理员审核后发布</span></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>系统状态</h2>
    <p>● API：${esc(s.api||'')}</p>
    <p>● 内容库：${s.sheets&&s.sheets.days?'正常':'异常'}</p>
    <p>● 研究关联表：${s.sheets&&s.sheets.research?'正常':'异常'}</p>
    <p>● 发布模式：人工审核</p>
    <div class="actions"><button class="primary" onclick="refresh()">系统检查 / 刷新</button><button onclick="backup()">备份内容库</button></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h2>MOS 内容原则</h2>
    <p>经文自由而不随意，设计精心而不控制。</p>
    <p>主日不强制拆解为周间；周间经文可因门训需要灵活选择；P/L/J 与 NT-DIS 是研究依据，不是机械绑定条件。</p>
    <p><b>产品目标：能用、肯用、爱用、有用。</b></p>
  </div>`;
}
function refresh(){boot()}
function renderWeeks(){
  let rows=DATA.weeks||[];
  $('page-weeks').innerHTML=`
  <div class="card">
    <div class="toolbar"><h2 style="margin-right:auto">52周内容</h2><select id="weekSelect" onchange="selectWeek(this.value)">${rows.map(w=>`<option value="${w.week}" ${+w.week===+currentWeek?'selected':''}>第 ${w.week} 周</option>`).join('')}</select></div>
    <div id="weekEditor"></div>
  </div>`;
  renderWeekEditor();
}
function selectWeek(v){currentWeek=+v;currentDow=0;renderWeekEditor();renderDays()}
function renderWeekEditor(){
  const w=(DATA.weeks||[]).find(x=>+x.week===currentWeek)||{};
  $('weekEditor').innerHTML=`
  <div class="fieldgrid">
    <div><label>年度阶段 / 模块</label><input id="wf_stage" value="${esc(w.stage)}"></div>
    <div><label>周标题</label><input id="wf_title" value="${esc(w.week_title)}"></div>
    <div><label>主日核心经文</label><input id="wf_ref" value="${esc(w.sunday_scripture)}"></div>
    <div><label>节期状态</label><input id="wf_feast" value="${esc(w.feast_status)}"></div>
  </div>
  <label>主日信息</label><textarea id="wf_msg">${esc(w.sunday_message)}</textarea>
  <label>门训目标</label><textarea id="wf_goal">${esc(w.discipleship_goal)}</textarea>
  <div class="fieldgrid">
    <div><label>P研究代码</label><input id="wf_p" value="${esc(w.p_codes)}"></div>
    <div><label>L研究代码</label><input id="wf_l" value="${esc(w.l_codes)}"></div>
    <div><label>J研究代码</label><input id="wf_j" value="${esc(w.j_codes)}"></div>
    <div><label>NT-DIS代码</label><input id="wf_n" value="${esc(w.ntdis_codes)}"></div>
    <div><label>校准状态</label><select id="wf_cal">${['候选稿','神学校准中','内容优化中','已校准','待修改'].map(x=>`<option ${w.calibration_status===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label>版本</label><input id="wf_ver" value="${esc(w.version||'1.0')}"></div>
  </div>
  <div class="actions"><button class="primary" onclick="saveWeek()">保存第 ${currentWeek} 周</button><button onclick="openWeekDays()">查看本周7日</button></div>`;
}
function saveWeek(){
  const old=(DATA.weeks||[]).find(x=>+x.week===currentWeek)||{};
  const p=Object.assign({},old,{week:currentWeek,stage:$('wf_stage').value,week_title:$('wf_title').value,sunday_scripture:$('wf_ref').value,feast_status:$('wf_feast').value,sunday_message:$('wf_msg').value,discipleship_goal:$('wf_goal').value,p_codes:$('wf_p').value,l_codes:$('wf_l').value,j_codes:$('wf_j').value,ntdis_codes:$('wf_n').value,calibration_status:$('wf_cal').value,version:$('wf_ver').value,published:old.published===true});
  google.script.run.withSuccessHandler(r=>{msg('✅ 第 '+currentWeek+' 周已保存');boot()}).withFailureHandler(e=>msg('保存失败：'+e.message)).saveWeek(TOKEN,p);
}
function openWeekDays(){showPage('days');renderDays()}
function renderDays(){
  const days=(DATA.days||[]).filter(x=>+x.week===+currentWeek);
  $('page-days').innerHTML=`
  <div class="card">
    <div class="toolbar"><h2 style="margin-right:auto">第 ${currentWeek} 周 · 每日内容</h2><button onclick="showPage('weeks')">返回周内容</button></div>
    <div class="row7">${days.map(d=>`<button class="daybtn ${+d.dow===+currentDow?'active':''} ${String(d.published).toLowerCase()==='true'?'published':''}" onclick="selectDay(${d.dow})">${esc(d.day_name)}</button>`).join('')}</div>
    <div id="dayEditor" style="margin-top:15px"></div>
  </div>`;
  selectDay(currentDow);
}
function selectDay(dow){currentDow=+dow;currentDay=(DATA.days||[]).find(x=>+x.week===+currentWeek&&+x.dow===+currentDow);renderDayEditor()}
function renderDayEditor(){
  const d=currentDay||{};
  if(!d.day_id){$('dayEditor').innerHTML='<p class="muted">找不到日单元。</p>';return}
  $('dayEditor').innerHTML=`
  <div class="editorHead"><div><h3 style="margin-bottom:4px">${esc(d.day_name)} · ${esc(d.title)}</h3><span class="badge ${String(d.published).toLowerCase()==='true'?'ok':'warn'}">${String(d.published).toLowerCase()==='true'?'已发布':'草稿'}</span></div></div>
  <div class="fieldgrid">
    <div><label>标题</label><input id="df_title" value="${esc(d.title)}"></div>
    <div><label>经文出处</label><input id="df_ref" value="${esc(d.scripture_ref)}"></div>
  </div>
  <label>和合本经文原文</label><textarea id="df_text">${esc(d.scripture_text)}</textarea>
  <div class="fieldgrid">
    <div><label>经文策略</label><select id="df_type">${['主日延伸','同主题互证','生命补充','节期经文','灵活发现'].map(x=>`<option ${d.scripture_type===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label>节期状态</label><select id="df_feast">${['无','补充','覆盖','主导'].map(x=>`<option ${d.feast_status===x?'selected':''}>${x}</option>`).join('')}</select></div>
  </div>
  <label>今日主题</label><input id="df_theme" value="${esc(d.day_theme)}">
  <label>今日引导</label><textarea id="df_guide">${esc(d.guide)}</textarea>
  <label>思考问题</label><textarea id="df_q">${esc(d.question)}</textarea>
  <div class="fieldgrid">
    <div><label>今日操练</label><textarea id="df_practice">${esc(d.practice)}</textarea></div>
    <div><label>关系 / 伙伴反馈</label><textarea id="df_rel">${esc(d.relationship)}</textarea></div>
  </div>
  <label>使命指向</label><textarea id="df_mission">${esc(d.mission)}</textarea>
  <div class="fieldgrid">
    <div><label>P研究代码（可为空）</label><input id="df_p" value="${esc(d.p_codes)}"></div>
    <div><label>L研究代码（可为空）</label><input id="df_l" value="${esc(d.l_codes)}"></div>
    <div><label>J研究代码（可为空）</label><input id="df_j" value="${esc(d.j_codes)}"></div>
    <div><label>NT-DIS代码（可为空）</label><input id="df_n" value="${esc(d.ntdis_codes)}"></div>
    <div><label>证据等级</label><input id="df_e" value="${esc(d.evidence_level)}"></div>
    <div><label>校准状态</label><select id="df_c">${['待核验','候选稿','神学校准中','内容优化中','已校准','待修改'].map(x=>`<option ${d.calibration_status===x?'selected':''}>${x}</option>`).join('')}</select></div>
  </div>
  <div class="notice">研究依据是辅助记录，不强制每一天必须对应 P/L/J 或 NT-DIS。若是根据邻近主题灵活选择，可保留为空。</div>
  <div class="actions">
    <button class="primary" onclick="saveDay()">保存草稿</button>
    <button onclick="togglePublishDayWeek()">发布 / 取消发布本周</button>
  </div>`;
}
function saveDay(){
  const d=currentDay;
  const p=Object.assign({},d,{
    title:$('df_title').value,scripture_ref:$('df_ref').value,scripture_text:$('df_text').value,
    scripture_type:$('df_type').value,feast_status:$('df_feast').value,day_theme:$('df_theme').value,
    guide:$('df_guide').value,question:$('df_q').value,practice:$('df_practice').value,
    relationship:$('df_rel').value,mission:$('df_mission').value,p_codes:$('df_p').value,
    l_codes:$('df_l').value,j_codes:$('df_j').value,ntdis_codes:$('df_n').value,
    evidence_level:$('df_e').value,calibration_status:$('df_c').value
  });
  google.script.run.withSuccessHandler(r=>{msg('✅ 已保存：'+d.day_name);boot()}).withFailureHandler(e=>msg('保存失败：'+e.message)).saveDay(TOKEN,p);
}
function togglePublishDayWeek(){
  const days=(DATA.days||[]).filter(x=>+x.week===+currentWeek);
  const published=days.every(x=>String(x.published).toLowerCase()==='true');
  const target=!published;
  if(!confirm((target?'发布':'取消发布')+'第 '+currentWeek+' 周的7个日单元？'))return;
  google.script.run.withSuccessHandler(r=>{msg((target?'✅ 已发布':'已取消发布')+'第 '+currentWeek+' 周');boot()}).withFailureHandler(e=>msg('失败：'+e.message)).publishWeek(TOKEN,currentWeek,target);
}
function renderEvents(){
  const events=DATA.events||[];
  $('page-events').innerHTML=`
  <div class="card"><h2>节期 / 特殊节点</h2>
  <div class="notice">节期是年度门训的重要补充层，不强制取代52周主线。V1.0先提供查看；编辑节期数据可继续在 Google Sheet 完成。</div>
  ${events.length?events.map(e=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><b>${esc(e.name)}</b> <span class="badge">${esc(e.type)}</span><div class="muted">${esc(e.start_date)} → ${esc(e.end_date)}</div><div>${esc(e.notes)}</div></div>`).join(''):'<p class="muted">目前没有节期数据。</p>'}
  </div>`;
}
function renderPublish(){
  const rows=DATA.weeks||[];
  $('page-publish').innerHTML=`
  <div class="card"><h2>发布管理</h2><div class="notice">只有管理员明确发布后，用户端才读取内容。</div>
  <table style="width:100%;border-collapse:collapse"><tr><th style="padding:8px;text-align:left">周</th><th>标题</th><th>校准</th><th>发布</th><th>操作</th></tr>
  ${rows.map(w=>`<tr><td style="padding:8px;border-top:1px solid #eee">第${w.week}周</td><td style="border-top:1px solid #eee">${esc(w.week_title||'—')}</td><td style="border-top:1px solid #eee">${esc(w.calibration_status||'—')}</td><td style="border-top:1px solid #eee">${String(w.published).toLowerCase()==='true'?'<span class="badge ok">已发布</span>':'<span class="badge">草稿</span>'}</td><td style="border-top:1px solid #eee"><button onclick="currentWeek=${w.week};showPage('days');renderDays()">${String(w.published).toLowerCase()==='true'?'管理':'查看 / 发布'}</button></td></tr>`).join('')}
  </table></div>`;
}
function backup(){
  google.script.run.withSuccessHandler(r=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.json],{type:'application/json'}));a.download=r.filename;a.click();msg('✅ 内容库备份已生成');
  }).withFailureHandler(e=>msg('备份失败：'+e.message)).backupContent(TOKEN);
}
if(location.protocol==='file:'){}
</script>
</body>
</html>
